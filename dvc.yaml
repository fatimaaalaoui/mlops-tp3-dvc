
stages:
  preparer:
    cmd: python src/preparer.py
    deps:
      - src/preparer.py
      - donnees.py
      - params.yaml
      - data/transactions.csv
    outs:
      - data/prepare/train.csv
      - data/prepare/test.csv

  entrainer:
    cmd: python src/entrainer.py
    deps:
      - src/entrainer.py
      - params.yaml
      - data/prepare/train.csv
    outs:
      - models/model.pkl

  evaluer:
    cmd: python src/evaluer.py
    deps:
      - src/evaluer.py
      - data/prepare/test.csv
      - models/model.pkl
    metrics:
      - reports/metrics.json
    outs:
      - reports/confusion.png
